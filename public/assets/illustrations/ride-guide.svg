<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="760" viewBox="0 0 1600 760" font-family="Arial, Helvetica, sans-serif">
<defs>
  <radialGradient id="bg" cx=".62" cy=".45" r=".75"><stop stop-color="#1e3b4b"/><stop offset="1" stop-color="#101b22"/></radialGradient>
  <pattern id="blocks" width="112" height="96" patternUnits="userSpaceOnUse"><rect x="10" y="10" width="92" height="76" rx="10" fill="#8fb3c4" fill-opacity=".06"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".38"/></filter>
  <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="10"/></filter>
  <g id="walk" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="1" cy="-12" r="3.5" fill="currentColor" stroke="none"/><path d="M0-6-2 4-7 13M-2 4l6 9M0-4l6 5M0-4l-6 4"/></g>
  <g id="scooter" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2-13h7M5-13l5 21M-12 8h21"/><circle cx="-12" cy="11" r="4.5"/><circle cx="11" cy="11" r="4.5"/></g>
  <g id="train" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-14" width="20" height="23" rx="5"/><path d="M-6-9h12v6H-6zM-7 14l-3 4M7 14l3 4"/><circle cx="-5" cy="4" r="1" fill="currentColor"/><circle cx="5" cy="4" r="1" fill="currentColor"/></g>
</defs>

